sequence_length: 32
rgb_frames: 16
smoothing_window: 3
quality:
  min_hands_visible_pct: 0.7
  min_seconds: 0.4
  max_seconds: 5.0
tta:
  views: 5
  trim_frames:
  - 0
  - 3
  - 6
decision:
  # Honest defaults: abstain when unsure instead of guessing. The auto-picked
  # 0.5/0.0 came from a leaky validation split and accepted coin-flips live
  # (every sign -> low-confidence "How are you"). Re-pick with tools/
  # pick_thresholds.py once a clean (official-split or enrolled) set exists.
  t_accept: 0.85
  m_accept: 0.3
  min_model_agreement: all
  tta_agreement: 0.8
  t_confirm: 0.5
sentence:
  idle_seconds: 2.5
  max_words: 8
  mode: strict
context_prior:
  enabled: false
  scenario: null
