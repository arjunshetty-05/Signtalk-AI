name: signtalk_ai
description: SignTalk AI — real-time sign language recognition mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 2.5.1

  # Networking
  dio: 5.5.0+1
  web_socket_channel: 2.4.5

  # Camera / on-device inference
  camera: 0.10.6
  tflite_flutter: 0.10.4
  image: 4.2.0

  # Firebase
  firebase_core: 2.31.1
  firebase_auth: 4.19.6
  cloud_firestore: 4.17.4

  # Charts / UI
  fl_chart: 0.68.0
  google_fonts: 6.2.1

  # Utilities
  shared_preferences: 2.2.3
  path_provider: 2.1.3

  cupertino_icons: 1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    # Directory reference so `flutter pub get` doesn't fail before the real
    # movenet.tflite/bilstm.tflite are dropped in — see
    # assets/models/PLACEHOLDER_README.txt.
    - assets/models/
    - assets/offline_phrasebook.json
